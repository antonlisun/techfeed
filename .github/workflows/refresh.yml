name: Refresh feed

on:
  schedule:
    # Every 30 minutes. GitHub often runs scheduled jobs several minutes late —
    # that's normal and nothing to work around.
    - cron: "*/30 * * * *"
  workflow_dispatch:        # lets you refresh on demand from the Actions tab
  push:
    branches: [main]
    paths:                  # rebuild immediately when the fetching logic changes
      - sources.py
      - feeds.py
      - build.py

permissions:
  contents: write

concurrency:
  group: refresh-feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build feed
        run: python build.py

      - name: Commit if the stories changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "Nothing new to publish."
          else
            git commit -m "Refresh feed ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          fi
