[build]
  publish = "site"
  command = ""

  # Data-only commits (the 30-minute feed refresh) shouldn't burn a deploy.
  # Exit 0 tells Netlify to skip the build, so only UI changes redeploy.
  # With builds skipped, set REPO in site/app.js so the page fetches the fresh
  # feed.json from GitHub directly.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)site/data'"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"
