<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#202124" media="(prefers-color-scheme: dark)">
<title>TechFeed — Security &amp; tech news</title>
<meta name="description" content="Security and technology headlines from 18 sources, de-duplicated so the same story doesn't repeat.">
<link rel="canonical" href="https://techfeed.info/">

<meta property="og:type" content="website">
<meta property="og:site_name" content="TechFeed">
<meta property="og:title" content="TechFeed">
<meta property="og:description" content="Security and technology headlines from 18 sources, de-duplicated so the same story doesn't repeat.">
<meta property="og:url" content="https://techfeed.info/">
<meta name="twitter:card" content="summary">

<meta name="apple-mobile-web-app-title" content="TechFeed">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📰</text></svg>">
</head>
<body>

<header class="topbar">
  <div class="searchbar">
    <svg class="ic-search" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
    </svg>
    <input id="search" type="search" placeholder="Search stories" autocomplete="off" spellcheck="false" aria-label="Search stories">
    <button id="clear" class="iconbtn hidden" aria-label="Clear search">
      <svg viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </button>
    <span class="divider-v"></span>
    <button id="filter" class="iconbtn" aria-label="Filters" title="Filters">
      <svg viewBox="0 0 24 24"><path d="M4.25 5.61C6.27 8.2 10 13 10 13v5c0 1.1.9 2 2 2s2-.9 2-2v-5s3.72-4.8 5.74-7.39A.999.999 0 0 0 18.95 4H5.04c-.83 0-1.3.95-.79 1.61z"/></svg>
      <span id="filtercount" class="badge hidden"></span>
    </button>
    <button id="theme" class="iconbtn" aria-label="Toggle theme" title="Toggle theme">
      <svg viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zm0-5v3m0 14v3M4.22 4.22l2.12 2.12m11.32 11.32 2.12 2.12M2 12h3m14 0h3M4.22 19.78l2.12-2.12M17.66 6.34l2.12-2.12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
    </button>
    <button id="refresh" class="iconbtn" aria-label="Refresh feed" title="Refresh">
      <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
    </button>
  </div>
  <nav class="chips" id="chips" aria-label="Topics"></nav>
</header>

<main id="feed" class="feed" aria-live="polite"></main>

<button id="newpill" class="newpill hidden">
  <svg viewBox="0 0 24 24"><path d="M12 4l-8 8h5v8h6v-8h5z"/></svg><span></span>
</button>

<div id="menu" class="menu hidden" role="menu"></div>
<div id="panel" class="panel hidden" role="dialog" aria-label="Filters" aria-modal="true"></div>
<div id="toast" class="toast hidden"><span></span><button type="button">Undo</button></div>
<div id="scrim" class="scrim hidden"></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
